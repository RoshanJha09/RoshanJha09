name: Update Daily Motivation

on:
  schedule:
    - cron: '0 4 * * *' # every day at 9:30 AM IST
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Fetch daily quote
      id: get_quote
      run: |
        curl -s https://zenquotes.io/api/random | jq -r '.[0].q + " — " + .[0].a' > quote.txt
        echo "quote=$(cat quote.txt)" >> "$GITHUB_OUTPUT"

    - name: Update README
      run: |
        quote="${{ steps.get_quote.outputs.quote }}"
        awk -v quote="$quote" '
          /<!--START_SECTION:daily_log-->/ { print; print quote; skip=1; next }
          /<!--END_SECTION:daily_log-->/ { skip=0 }
          !skip
        ' README.md > temp && mv temp README.md

    - name: Commit changes
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add README.md
        git commit -m "🗓️ Update Daily Quote"
        git push
